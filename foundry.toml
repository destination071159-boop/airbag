[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
# no solc_version pin: forge auto-selects per file (v4-core pins =0.8.26, core/curve need 0.8.30),
# so a single project compiles both dependency trees with their respective compilers.
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}, {access = "read-write", path = "./frontend/src/lib/"}, {access = "read", path = "./out"}]

[profile.default.optimizer_details]
yul = true
yulDetails = { stackAllocation = true, optimizerSteps = "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul Tpeul]jmul[jul] VcTOcul jmul : fDnTOcmu" }

[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
